# ============================================================================
# TASK ASSIGNMENT DOMAIN - Task Management Schema
# ============================================================================

"""
TaskAssignment type representing work assignments
"""
type TaskAssignment {
  id: String!

  """
  Assignment details
  """
  processId: String!
  employeeId: String!
  departmentId: String!

  name: String!
  description: String
  taskType: TaskType!

  """
  Capacity and effort
  """
  allocatedCapacityUnits: Int!
  effortHours: Float!
  estimatedDaysToComplete: Int

  """
  Status tracking
  """
  status: TaskStatus!
  priority: TaskPriority!

  """
  Progress tracking
  """
  completionPercentage: Int!
  actualDaysSpent: Int

  """
  Relations
  """
  process: Process!
  employee: Employee!
  department: Department!
  loadSnapshots: [LoadSnapshot!]!

  """
  Timestamps
  """
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  dueDate: DateTime!

  """
  Audit trail
  """
  createdBy: String!
  updatedBy: String
}

"""
Task type enumeration
"""
enum TaskType {
  DEVELOPMENT
  TESTING
  DOCUMENTATION
  REVIEW
  MEETING
  TRAINING
  ADMINISTRATIVE
  SUPPORT
  RESEARCH
  OTHER
}

"""
Task status enumeration
"""
enum TaskStatus {
  CREATED
  ASSIGNED
  IN_PROGRESS
  BLOCKED
  COMPLETED
  CANCELLED
  ON_HOLD
}

"""
Task priority enumeration
"""
enum TaskPriority {
  CRITICAL
  HIGH
  NORMAL
  LOW
}

"""
Input for creating a task assignment
"""
input CreateTaskAssignmentInput {
  processId: String!
  employeeId: String!
  name: String!
  description: String
  taskType: TaskType!
  allocatedCapacityUnits: Int!
  effortHours: Float!
  estimatedDaysToComplete: Int
  priority: TaskPriority
  dueDate: DateTime!
}

"""
Input for updating a task assignment
"""
input UpdateTaskAssignmentInput {
  name: String
  description: String
  status: TaskStatus
  priority: TaskPriority
  allocatedCapacityUnits: Int
  effortHours: Float
  completionPercentage: Int
  dueDate: DateTime
}

"""
Task assignment filter input
"""
input TaskAssignmentFilterInput {
  employeeId: String
  processId: String
  departmentId: String
  taskType: TaskType
  status: TaskStatus
  priority: TaskPriority
  search: String
  isOverdue: Boolean
  isBlocked: Boolean
}

"""
Pagination input for task assignments
"""
input TaskAssignmentPaginationInput {
  skip: Int
  take: Int
  orderBy: TaskAssignmentSortInput
}

"""
Task assignment sort input
"""
input TaskAssignmentSortInput {
  field: TaskAssignmentSortField!
  order: SortOrder!
}

"""
Task assignment sort fields
"""
enum TaskAssignmentSortField {
  CREATED_AT
  DUE_DATE
  PRIORITY
  COMPLETION_PERCENTAGE
  EFFORT_HOURS
}

"""
Task assignment response wrapper with pagination
"""
type TaskAssignmentConnection {
  nodes: [TaskAssignment!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""
Task assignment metrics
"""
type TaskAssignmentMetrics {
  assignment: TaskAssignment!
  workloadContribution: Float!
  utilizationRate: Float!
  onTrack: Boolean!
  daysUntilDue: Int!
  estimatedCompletionDate: DateTime
}

"""
Employee task statistics
"""
type EmployeeTaskStats {
  employee: Employee!
  totalAssignments: Int!
  activeAssignments: Int!
  completedAssignments: Int!
  blockedAssignments: Int!
  totalAllocatedCapacity: Int!
  averagePriority: String!
  tasksByStatus: [TaskStatusCount!]!
  tasksByType: [TaskTypeCount!]!
}

"""
Count of tasks by status
"""
type TaskStatusCount {
  status: TaskStatus!
  count: Int!
}

"""
Count of tasks by type
"""
type TaskTypeCount {
  taskType: TaskType!
  count: Int!
}

# ============================================================================
# Extended Query Type
# ============================================================================

extend type Query {
  """
  Get task assignment by ID
  """
  taskAssignment(id: String!): TaskAssignment

  """
  List all task assignments with filtering and pagination
  """
  taskAssignments(
    filter: TaskAssignmentFilterInput
    pagination: TaskAssignmentPaginationInput
  ): TaskAssignmentConnection!

  """
  Get tasks assigned to an employee
  """
  employeeTasks(employeeId: String!, status: TaskStatus): [TaskAssignment!]!

  """
  Get tasks in a process
  """
  processTasks(processId: String!, status: TaskStatus): [TaskAssignment!]!

  """
  Get employee task statistics
  """
  employeeTaskStats(employeeId: String!): EmployeeTaskStats!

  """
  Get overdue tasks
  """
  overdueTasks(departmentId: String): [TaskAssignment!]!

  """
  Get blocked tasks
  """
  blockedTasks(departmentId: String): [TaskAssignment!]!

  """
  Get task with detailed metrics
  """
  taskWithMetrics(id: String!): TaskAssignmentMetrics
}

# ============================================================================
# Extended Mutation Type
# ============================================================================

extend type Mutation {
  """
  Create a new task assignment
  """
  createTaskAssignment(input: CreateTaskAssignmentInput!): TaskAssignment!

  """
  Update a task assignment
  """
  updateTaskAssignment(
    id: String!
    input: UpdateTaskAssignmentInput!
  ): TaskAssignment!

  """
  Delete a task assignment
  """
  deleteTaskAssignment(id: String!): Boolean!

  """
  Start a task assignment
  """
  startTaskAssignment(id: String!): TaskAssignment!

  """
  Complete a task assignment
  """
  completeTaskAssignment(id: String!): TaskAssignment!

  """
  Block a task with reason
  """
  blockTaskAssignment(id: String!, reason: String!): TaskAssignment!

  """
  Unblock a task
  """
  unblockTaskAssignment(id: String!, resolution: String): TaskAssignment!

  """
  Update task progress
  """
  updateTaskProgress(
    id: String!
    completionPercentage: Int!
    actualDaysSpent: Int
  ): TaskAssignment!

  """
  Reassign task to different employee
  """
  reassignTask(taskId: String!, newEmployeeId: String!): TaskAssignment!
}

# ============================================================================
# Extended Subscription Type
# ============================================================================

extend type Subscription {
  """
  Subscribe to task assignment updates
  """
  taskAssignmentUpdated(taskId: String!): TaskAssignment!

  """
  Subscribe to new task creation
  """
  taskCreated(employeeId: String): TaskAssignment!

  """
  Subscribe to task status changes
  """
  taskStatusChanged(taskId: String!): TaskStatusChangeEvent!
}

"""
Event type for task status changes
"""
type TaskStatusChangeEvent {
  assignment: TaskAssignment!
  previousStatus: TaskStatus!
  newStatus: TaskStatus!
  changedAt: DateTime!
  changedBy: String!
  reason: String
}
