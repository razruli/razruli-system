# ============================================================================
# PROCESS DOMAIN - Process Management Schema
# ============================================================================

"""
Process type representing business processes
"""
type Process {
  id: String!

  """
  Process details
  """
  companyId: String!
  departmentId: String!
  name: String!
  description: String
  processType: ProcessType!

  """
  Capacity configuration
  """
  capacityUnits: Int!
  kMultiplier: Float!
  estimatedDurationDays: Int

  """
  Status tracking
  """
  status: ProcessStatus!
  priority: ProcessPriority!

  """
  Relations
  """
  company: Company!
  department: Department!
  taskAssignments: [TaskAssignment!]!
  loadSnapshots: [LoadSnapshot!]!

  """
  Timestamps
  """
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime

  """
  Audit trail
  """
  createdBy: String!
  updatedBy: String
}

"""
Process type enumeration
"""
enum ProcessType {
  RECRUITMENT
  ONBOARDING
  OFFBOARDING
  TRAINING
  PERFORMANCE_REVIEW
  PROJECT_DELIVERY
  MAINTENANCE
  AUDIT
  COMPLIANCE
  OTHER
}

"""
Process status enumeration
"""
enum ProcessStatus {
  DRAFT
  PLANNED
  IN_PROGRESS
  ON_HOLD
  COMPLETED
  CANCELLED
}

"""
Process priority enumeration
"""
enum ProcessPriority {
  CRITICAL
  HIGH
  NORMAL
  LOW
}

"""
Input for creating a process
"""
input CreateProcessInput {
  companyId: String!
  departmentId: String!
  name: String!
  description: String
  processType: ProcessType!
  capacityUnits: Int!
  kMultiplier: Float!
  estimatedDurationDays: Int
  priority: ProcessPriority
}

"""
Input for updating a process
"""
input UpdateProcessInput {
  name: String
  description: String
  status: ProcessStatus
  priority: ProcessPriority
  capacityUnits: Int
  kMultiplier: Float
  estimatedDurationDays: Int
}

"""
Process filter input
"""
input ProcessFilterInput {
  companyId: String
  departmentId: String
  processType: ProcessType
  status: ProcessStatus
  priority: ProcessPriority
  search: String
}

"""
Pagination input for processes
"""
input ProcessPaginationInput {
  skip: Int
  take: Int
  orderBy: ProcessSortInput
}

"""
Process sort input
"""
input ProcessSortInput {
  field: ProcessSortField!
  order: SortOrder!
}

"""
Process sort fields
"""
enum ProcessSortField {
  CREATED_AT
  UPDATED_AT
  CAPACITY_UNITS
  NAME
}

"""
Process response wrapper with pagination
"""
type ProcessConnection {
  nodes: [Process!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""
Process metrics for analytics
"""
type ProcessMetrics {
  process: Process!
  totalCapacityRequired: Int!
  utilizationRate: Float!
  averageResourcesAllocated: Int!
  completionRate: Float!
  taskCount: Int!
  activeTaskCount: Int!
}

# ============================================================================
# Extended Query Type
# ============================================================================

extend type Query {
  """
  Get process by ID
  """
  process(id: String!): Process

  """
  List all processes with filtering and pagination
  """
  processes(
    filter: ProcessFilterInput
    pagination: ProcessPaginationInput
  ): ProcessConnection!

  """
  List processes by department
  """
  departmentProcesses(departmentId: String!, status: ProcessStatus): [Process!]!

  """
  Get process with metrics for analytics
  """
  processWithMetrics(id: String!): ProcessMetrics

  """
  Get processes by company with metrics
  """
  companyProcessMetrics(
    companyId: String!
    filter: ProcessFilterInput
  ): [ProcessMetrics!]!
}

# ============================================================================
# Extended Mutation Type
# ============================================================================

extend type Mutation {
  """
  Create a new process
  """
  createProcess(input: CreateProcessInput!): Process!

  """
  Update an existing process
  """
  updateProcess(id: String!, input: UpdateProcessInput!): Process!

  """
  Delete a process
  """
  deleteProcess(id: String!): Boolean!

  """
  Start a process
  """
  startProcess(id: String!): Process!

  """
  Complete a process
  """
  completeProcess(id: String!): Process!

  """
  Cancel a process
  """
  cancelProcess(id: String!, reason: String): Process!

  """
  Assign capacity to process
  """
  assignProcessCapacity(
    processId: String!
    capacityUnits: Int!
    kMultiplier: Float!
  ): Process!
}

# ============================================================================
# Extended Subscription Type
# ============================================================================

extend type Subscription {
  """
  Subscribe to process updates
  """
  processUpdated(processId: String!): Process!

  """
  Subscribe to new process creation
  """
  processCreated(departmentId: String): Process!

  """
  Subscribe to process status changes
  """
  processStatusChanged(processId: String!): ProcessStatusChangeEvent!
}

"""
Event type for process status changes
"""
type ProcessStatusChangeEvent {
  process: Process!
  previousStatus: ProcessStatus!
  newStatus: ProcessStatus!
  changedAt: DateTime!
  changedBy: String!
  reason: String
}
