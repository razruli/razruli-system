# ============================================================================
# PROCESS DOMAIN - Process Management Schema
# ============================================================================

"""
Process type representing business processes
"""
type Process {
  id: String!

  """
  Process details
  """
  companyId: String!
  departmentId: String!
  title: String!
  description: String

  """
  Time and complexity estimation
  """
  plannedHours: Int!

  """
  Complexity metrics (converted to k-factors internally for weight calculation)
  """
  complexity: ComplexityLevel!
  businessImpact: BusinessImpactLevel!
  newness: NewnessLevel!
  isBurningOut: Boolean!

  """
  Calculated weight and target grade
  Weight is stored at creation/import time, can be recalculated
  Formula: (plannedHours/8) × (1 + kBurn + kCrit + kNew)
  """
  weight: Float
  targetGradeId: Int!

  """
  Status tracking
  """
  status: ProcessStatusEnum!

  """
  Relations
  """
  company: Company!
  department: Department!
  targetGrade: Grade!
  taskAssignments: [TaskAssignment]

  """
  Timestamps
  """
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Complexity level enumeration - maps to k-factors internally
"""
enum ComplexityLevel {
  ROUTINE
  STANDARD
  COMPLEX
  EXPERT
}

"""
Business Impact enumeration - importance/priority of the process
"""
enum BusinessImpactLevel {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

"""
Newness/Learning Curve enumeration
"""
enum NewnessLevel {
  ROUTINE
  FAMILIAR
  NEW
  EXPERIMENTAL
}

"""
Process Status enumeration
"""
enum ProcessStatusEnum {
  OPEN
  IN_PROGRESS
  COMPLETED
  CANCELLED
  ON_HOLD
}

"""
Input for creating a process
"""
input CreateProcessInput {
  companyId: String!
  departmentId: String!
  title: String!
  description: String
  plannedHours: Int!
  complexity: ComplexityLevel
  businessImpact: BusinessImpactLevel
  newness: NewnessLevel
  isBurningOut: Boolean
  targetGradeId: Int!
  status: ProcessStatusEnum
}

"""
Input for updating a process
"""
input UpdateProcessInput {
  title: String
  description: String
  plannedHours: Int
  complexity: ComplexityLevel
  businessImpact: BusinessImpactLevel
  newness: NewnessLevel
  isBurningOut: Boolean
  status: ProcessStatusEnum
  targetGradeId: Int
}

"""
Process filter input
"""
input ProcessFilterInput {
  companyId: String
  departmentId: String
  status: String
  search: String
}

"""
Pagination input for processes
"""
input ProcessPaginationInput {
  skip: Int
  take: Int
  orderBy: ProcessSortInput
}

"""
Process sort input
"""
input ProcessSortInput {
  field: ProcessSortField!
  order: SortOrder!
}

"""
Process sort fields
"""
enum ProcessSortField {
  CREATED_AT
  UPDATED_AT
  TITLE
  PLANNED_HOURS
  STATUS
}

"""
Process response wrapper with pagination
"""
type ProcessConnection {
  nodes: [Process!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""
Process metrics for analytics
"""
type ProcessMetrics {
  process: Process!
  totalCapacityRequired: Int!
  utilizationRate: Float!
  averageResourcesAllocated: Int!
  completionRate: Float!
  taskCount: Int!
  activeTaskCount: Int!
}

# ============================================================================
# Extended Query Type
# ============================================================================

extend type Query {
  """
  Get process by ID
  """
  process(id: String!): Process

  """
  List all processes with filtering and pagination
  """
  processes(
    filter: ProcessFilterInput
    pagination: ProcessPaginationInput
  ): ProcessConnection!

  """
  List processes by department
  """
  departmentProcesses(departmentId: String!, status: String): [Process!]!

  """
  Get process with metrics for analytics
  """
  processWithMetrics(id: String!): ProcessMetrics

  """
  Get processes by company with metrics
  """
  companyProcessMetrics(
    companyId: String!
    filter: ProcessFilterInput
  ): [ProcessMetrics!]!
}

"""
Process status change event
"""
type ProcessStatusChangeEvent {
  processId: String!
  oldStatus: String!
  newStatus: String!
  timestamp: DateTime!
}

# ============================================================================
# Extended Mutation Type
# ============================================================================

extend type Mutation {
  """
  Create a new process
  """
  createProcess(input: CreateProcessInput!): Process!

  """
  Update an existing process
  """
  updateProcess(id: String!, input: UpdateProcessInput!): Process!

  """
  Delete a process
  """
  deleteProcess(id: String!): Boolean!
}

# ============================================================================
# Extended Subscription Type
# ============================================================================

extend type Subscription {
  """
  Subscribe to process updates
  """
  processUpdated(processId: String!): Process!

  """
  Subscribe to new process creation
  """
  processCreated(departmentId: String): Process!

  """
  Subscribe to process status changes
  """
  processStatusChanged(processId: String!): ProcessStatusChangeEvent!
}
