# ============================================================================
# AUDIT LOG DOMAIN - System Activity & Compliance Audit Schema
# ============================================================================

"""
AuditLog type tracking system activities for compliance and debugging
"""
type AuditLog {
  id: String!

  """
  Log metadata
  """
  entityType: String!
  entityId: String!
  actionType: AuditActionType!

  """
  Actor information
  """
  userId: String!
  userEmail: String!
  ipAddress: String
  userAgent: String

  """
  Action details
  """
  description: String!
  oldValues: JSON
  newValues: JSON
  status: AuditStatus!

  """
  Context
  """
  companyId: String!
  departmentId: String
  result: AuditResult!
  errorMessage: String

  """
  Performance metrics
  """
  durationMs: Int

  """
  Timestamps
  """
  createdAt: DateTime!
  timestamp: DateTime!
}

"""
Audit action type
"""
enum AuditActionType {
  CREATE
  READ
  UPDATE
  DELETE
  IMPORT
  EXPORT
  LOGIN
  LOGOUT
  PERMISSION_CHANGE
  CONFIGURATION_CHANGE
  BULK_OPERATION
  APPROVAL
  REJECTION
  PUBLISH
  UNPUBLISH
  OTHER
}

"""
Audit status
"""
enum AuditStatus {
  SUCCESS
  FAILURE
  PARTIAL_SUCCESS
  PENDING_APPROVAL
}

"""
Audit result
"""
enum AuditResult {
  SUCCESS
  FAILED
  UNAUTHORIZED
  FORBIDDEN
  VALIDATION_ERROR
  CONFLICT
  TIMEOUT
  UNKNOWN_ERROR
}

"""
Audit log filter input
"""
input AuditLogFilterInput {
  entityType: String
  entityId: String
  actionType: AuditActionType
  userId: String
  companyId: String!
  dateRange: DateRangeInput
  status: AuditStatus
  result: AuditResult
}

"""
Pagination input for audit logs
"""
input AuditLogPaginationInput {
  skip: Int
  take: Int
  orderBy: AuditLogSortInput
}

"""
Audit log sort input
"""
input AuditLogSortInput {
  field: AuditLogSortField!
  order: SortOrder!
}

"""
Audit log sort fields
"""
enum AuditLogSortField {
  TIMESTAMP
  CREATED_AT
  ACTION_TYPE
  ENTITY_TYPE
}

"""
Audit log response wrapper
"""
type AuditLogConnection {
  nodes: [AuditLog!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""
User activity summary
"""
type UserActivitySummary {
  user: User!
  activePeriod: DateRange!
  generatedAt: DateTime!

  """
  Activity statistics
  """
  totalActions: Int!
  actionsByType: [ActionTypeSummary!]!
  successRate: Float!
  failureCount: Int!

  """
  Recent activity
  """
  recentActions: [AuditLog!]!

  """
  Risk indicators
  """
  unusualActivities: String!
  riskScore: Int!
}

"""
Action type summary
"""
type ActionTypeSummary {
  actionType: AuditActionType!
  count: Int!
  successCount: Int!
  failureCount: Int!
}

"""
Entity change audit trail
"""
type EntityAuditTrail {
  entityType: String!
  entityId: String!

  """
  Full change timeline
  """
  timeline: [AuditLog!]!

  """
  Snapshots at key points
  """
  currentState: JSON
  previousState: JSON

  """
  Change analysis
  """
  totalChanges: Int!
  changesByUser: [ChangeByUser!]!
}

"""
Changes by specific user
"""
type ChangeByUser {
  user: User!
  changeCount: Int!
  timestamp: DateTime!
}

"""
Compliance report
"""
type ComplianceReport {
  company: Company!
  reportPeriod: DateRange!
  generatedAt: DateTime!

  """
  Compliance metrics
  """
  totalAuditedActions: Int!
  complianceRate: Float!

  """
  Risk assessment
  """
  highRiskActivities: [AuditLog!]!
  suspiciousPatterns: [String!]!

  """
  User access review
  """
  userAccessSummary: [UserAccessSummary!]!

  """
  Data protection metrics
  """
  sensitiveDataAccess: Int!
  unauthorizedAccessAttempts: Int!
  dataExportCount: Int!
}

"""
User access summary for compliance
"""
type UserAccessSummary {
  user: User!
  lastLogin: DateTime!
  activeMinutesThisPeriod: Int!
  dataAccessCount: Int!
  criticalActionsCount: Int!
  riskLevel: AccessRiskLevel!
}

"""
Access risk level
"""
enum AccessRiskLevel {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

"""
Security incident report
"""
type SecurityIncidentReport {
  company: Company!
  period: DateRange!
  generatedAt: DateTime!

  """
  Incidents
  """
  totalIncidents: Int!
  incidents: [SecurityIncident!]!

  """
  Prevention metrics
  """
  blockedAttempts: Int!
  failedAuthAttempts: Int!
  suspiciousBehavior: Int!
}

"""
Security incident
"""
type SecurityIncident {
  type: String!
  severity: IncidentSeverity!
  description: String!
  detectedAt: DateTime!
  affectedUsers: Int!
  involvedLogs: [AuditLog!]!
  resolution: String
}

"""
Incident severity level
"""
enum IncidentSeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
}

# ============================================================================
# Extended Query Type
# ============================================================================

extend type Query {
  """
  Get audit log entry by ID
  """
  auditLog(id: String!): AuditLog

  """
  List audit logs with filtering
  """
  auditLogs(
    filter: AuditLogFilterInput!
    pagination: AuditLogPaginationInput
  ): AuditLogConnection!

  """
  Get entity audit trail
  """
  entityAuditTrail(entityType: String!, entityId: String!): EntityAuditTrail!

  """
  Get user activity summary
  """
  userActivitySummary(
    userId: String!
    dateRange: DateRangeInput!
  ): UserActivitySummary!

  """
  Get compliance report
  """
  complianceReport(
    companyId: String!
    dateRange: DateRangeInput!
  ): ComplianceReport!

  """
  Get security incident report
  """
  securityIncidentReport(
    companyId: String!
    dateRange: DateRangeInput!
  ): SecurityIncidentReport!

  """
  Find suspicious activities
  """
  suspiciousActivities(companyId: String!, threshold: Int): [AuditLog!]!

  """
  Check failed login attempts
  """
  failedLoginAttempts(dateRange: DateRangeInput): [AuditLog!]!

  """
  Get data access audit
  """
  dataAccessAudit(companyId: String!, dateRange: DateRangeInput): [AuditLog!]!
}

# ============================================================================
# Extended Mutation Type
# ============================================================================

extend type Mutation {
  """
  Log an audit entry
  """
  logAuditEntry(input: LogAuditEntryInput!): AuditLog!

  """
  Bulk log audit entries
  """
  bulkLogAuditEntries(entries: [LogAuditEntryInput!]!): [AuditLog!]!

  """
  Mark audit logs for archival
  """
  archiveAuditLogs(dateRange: DateRangeInput!): Int!

  """
  Export audit logs
  """
  exportAuditLogs(filter: AuditLogFilterInput!, format: ExportFormat!): String!
}

"""
Input for logging audit entry
"""
input LogAuditEntryInput {
  entityType: String!
  entityId: String!
  actionType: AuditActionType!
  userId: String!
  description: String!
  oldValues: JSON
  newValues: JSON
  status: AuditStatus
  result: AuditResult
  companyId: String!
  departmentId: String
  ipAddress: String
  userAgent: String
  durationMs: Int
}

"""
Export format for audit logs
"""
enum ExportFormat {
  CSV
  JSON
  PDF
  XLSX
}

# ============================================================================
# Extended Subscription Type
# ============================================================================

extend type Subscription {
  """
  Subscribe to audit log entries
  """
  auditLogCreated(companyId: String!): AuditLog!

  """
  Subscribe to high-risk activities
  """
  riskActivityDetected(companyId: String!): RiskActivityEvent!

  """
  Subscribe to security incidents
  """
  securityIncidentDetected(companyId: String!): SecurityIncidentEvent!
}

"""
Risk activity event
"""
type RiskActivityEvent {
  log: AuditLog!
  riskScore: Int!
  reason: String!
  timestamp: DateTime!
}

"""
Security incident event
"""
type SecurityIncidentEvent {
  incident: SecurityIncident!
  detectedAt: DateTime!
  requiresImmediateAction: Boolean!
}
