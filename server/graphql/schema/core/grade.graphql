"""
Grade type - Seniority levels/grades
Reference data that doesn't change often
"""
type Grade {
  """
  Grade ID (0-5: Intern to C-level)
  """
  id: Int!

  """
  Human readable name
  """
  name: String!

  """
  Grade coefficient for capacity calculation
  """
  kGrade: Float!

  """
  Description
  """
  description: String

  """
  Employees with this grade
  """
  employees: [Employee!]! # Field resolver
  """
  Processes targeting this grade
  """
  processes: [Process!]! # Field resolver
}

extend type Query {
  """
  Get grade by ID
  """
  grade(id: Int!): Grade

  """
  Get all grades
  """
  grades: [Grade!]!

  """
  Get grade with employee count
  """
  gradeWithStats(id: Int!): GradeStats
}

extend type Mutation {
  """
  Create a new grade (requires grade:create permission)
  """
  createGrade(input: CreateGradeInput!): Grade!

  """
  Update an existing grade (requires grade:update permission)
  """
  updateGrade(id: Int!, input: UpdateGradeInput!): Grade!

  """
  Delete a grade (requires grade:delete permission)
  """
  deleteGrade(id: Int!): Grade!
}

"""
Grade input for creation
"""
input CreateGradeInput {
  """
  Human readable name
  """
  name: String!

  """
  Grade level/seniority
  """
  level: Int

  """
  Description
  """
  description: String

  """
  Minimum salary for this grade
  """
  minSalary: Float

  """
  Maximum salary for this grade
  """
  maxSalary: Float
}

"""
Grade input for updates
"""
input UpdateGradeInput {
  """
  Human readable name
  """
  name: String

  """
  Grade level/seniority
  """
  level: Int

  """
  Description
  """
  description: String

  """
  Minimum salary for this grade
  """
  minSalary: Float

  """
  Maximum salary for this grade
  """
  maxSalary: Float
}

"""
Grade with statistics
"""
type GradeStats {
  grade: Grade!
  employeeCount: Int!
  averageEfficiency: Float!
  overloadedCount: Int!
}
