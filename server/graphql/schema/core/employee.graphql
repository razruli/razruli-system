"""
Employee type and resolvers
Represents a team member with capacity coefficients and employment details
"""
type Employee {
  """
  Unique identifier
  """
  id: String!

  """
  Company this employee belongs to
  """
  companyId: String!

  """
  Department assignment
  """
  departmentId: String!
  department: Department! # Field resolver
  """
  First name
  """
  firstName: String!

  """
  Last name
  """
  lastName: String!

  """
  Seniority level/Grade
  """
  gradeId: Int!
  grade: Grade! # Field resolver
  """
  Gender (MALE/FEMALE/OTHER)
  """
  gender: String!

  """
  Date of birth
  """
  birthDate: DateTime

  """
  Hire date
  """
  hireDate: DateTime!

  """
  Dismissal date (null if active)
  """
  fireDate: DateTime

  """
  Efficiency coefficient (multiplier, default 1.0)
  """
  kEfficiency: Float

  """
  Employment type (LABOR_CONTRACT/SERVICE_CONTRACT/SELF_EMPLOYED)
  """
  employmentType: String!

  """
  Current status (ACTIVE/INACTIVE/ON_LEAVE/TERMINATED)
  """
  status: String!

  """
  Working hours per day
  """
  workingHoursPerDay: Int!

  """
  Task assignments
  """
  taskAssignments: [TaskAssignment] # Field resolver
  """
  Load snapshots
  """
  loadSnapshots: [LoadSnapshot] # Field resolver
  """
  Change history
  """
  history: [EmployeeHistory] # Field resolver
  """
  Metadata (JSON)
  """
  metadata: JSON

  """
  Created at
  """
  createdAt: DateTime!

  """
  Updated at
  """
  updatedAt: DateTime!
}

"""
Required fields for creating an employee
"""
input CreateEmployeeInput {
  companyId: String!
  departmentId: String!
  firstName: String!
  lastName: String!
  gradeId: Int!
  gender: String!
  hireDate: DateTime!
  birthDate: DateTime
  employmentType: String
  workingHoursPerDay: Int
  kEfficiency: Float
}

"""
Fields that can be updated
"""
input UpdateEmployeeInput {
  firstName: String
  lastName: String
  gradeId: Int
  departmentId: String
  gender: String
  status: String
  kEfficiency: Float
  workingHoursPerDay: Int
  birthDate: DateTime
  fireDate: DateTime
  employmentType: String
}

"""
Filter options for employee queries
"""
input EmployeeFilterInput {
  companyId: String
  departmentId: String
  gradeId: Int
  status: String
  search: String # Search in firstName/lastName
}

"""
Pagination and sorting
"""
input EmployeePaginationInput {
  limit: Int
  offset: Int
  sortBy: String
  sortOrder: SortOrder
}

"""
Response with employee list and pagination
"""
type EmployeeConnection {
  nodes: [Employee!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

extend type Query {
  """
  Get employee by ID
  """
  employee(id: String!): Employee

  """
  Get employees with optional filters
  """
  employees(
    filter: EmployeeFilterInput
    pagination: EmployeePaginationInput
  ): EmployeeConnection!

  """
  Get employees in specific department
  """
  departmentEmployees(departmentId: String!): [Employee!]!

  """
  Get employee capacity metrics
  """
  employeeCapacity(id: String!): Float!

  """
  Get employee load index
  """
  employeeLoadIndex(
    id: String!
    periodStart: DateTime!
    periodEnd: DateTime!
  ): Float!
}

extend type Mutation {
  """
  Create new employee
  """
  createEmployee(input: CreateEmployeeInput!): Employee!

  """
  Update employee
  """
  updateEmployee(id: String!, input: UpdateEmployeeInput!): Employee!

  """
  Dismiss employee (soft delete)
  """
  dismissEmployee(id: String!, reason: String): Employee!

  """
  Update employee efficiency coefficient
  """
  updateEmployeeEfficiency(id: String!, kEfficiency: Float!): Employee!
}

extend type Subscription {
  """
  Subscribe to employee changes (updates)
  Can subscribe to all updates if no departmentId provided
  """
  employeeUpdated(departmentId: String): Employee!

  """
  Subscribe to new employee creation
  Can subscribe to department-specific or company-wide
  """
  employeeCreated(departmentId: String): Employee!

  """
  Subscribe to employee dismissals
  Can subscribe to department-specific or company-wide
  """
  employeeDismissed(departmentId: String): Employee!

  """
  Subscribe to employee capacity changes
  Fires when capacity allocation changes for a specific employee
  """
  employeeCapacityChanged(employeeId: String!): Employee!

  """
  Subscribe to employee load threshold events
  Fires when employee load crosses a specified threshold
  """
  employeeLoadThresholdCrossed(employeeId: String!, threshold: Float): Employee!
}
