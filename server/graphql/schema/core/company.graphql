"""
Company type - Root entity for multi-tenant support
"""
type Company {
  """
  Unique identifier
  """
  id: String!

  """
  Company name
  """
  name: String!

  """
  Timezone (default UTC+3)
  """
  timezone: String!

  """
  Working hours per day (default 8)
  """
  workingHoursDay: Int!

  """
  Working days per month (default 21)
  """
  workingDaysPerMonth: Int!

  """
  All departments
  """
  departments: [Department!]! # Field resolver
  """
  All employees
  """
  employees: [Employee!]! # Field resolver
  """
  All processes
  """
  processes: [Process!]! # Field resolver
  """
  All task assignments
  """
  taskAssignments: [TaskAssignment!]! # Field resolver
  """
  All load snapshots
  """
  loadSnapshots: [LoadSnapshot!]! # Field resolver
  """
  Created at
  """
  createdAt: DateTime!

  """
  Updated at
  """
  updatedAt: DateTime!
}

"""
Input for creating a company
"""
input CreateCompanyInput {
  name: String!
  timezone: String
  workingHoursDay: Int
  workingDaysPerMonth: Int
}

"""
Input for updating a company
"""
input UpdateCompanyInput {
  name: String
  timezone: String
  workingHoursDay: Int
  workingDaysPerMonth: Int
}

extend type Query {
  """
  Get company by ID
  """
  company(id: String!): Company

  """
  Get authenticated user's company
  """
  myCompany: Company

  """
  Get all companies (admin only)
  """
  companies: [Company!]!
}

extend type Mutation {
  """
  Create new company (admin only)
  """
  createCompany(input: CreateCompanyInput!): Company!

  """
  Update company settings
  """
  updateCompany(id: String!, input: UpdateCompanyInput!): Company!
}
