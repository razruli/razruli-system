# ═══════════════════════════════════════════════════════════════════════════════
# AUTH TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

type User implements Node {
  id: ID!
  email: String!
  createdAt: DateTime!
  updatedAt: DateTime!

  image: String
  role: UserRole
  status: UserStatus!
  name: String
  phone: String
}

enum UserRole {
  admin
  broker
  carrier
  warehouse
  driver
}

enum UserStatus {
  active
  inactive
  pending
  suspended
}

type UsersResult {
  users: [User!]!
  pageInfo: PageInfo!
}

input UsersInput {
  limit: Int
  offset: Int
  sortBy: String
  sortOrder: SortOrder
  search: String
  status: UserStatus
  emailVerified: Boolean
  createdBefore: DateTime
  createdAfter: DateTime
}
