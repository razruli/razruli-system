# ═══════════════════════════════════════════════════════════════════════════════
# PARTY FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════
# Reusable field groupings for all party types (Broker, Carrier, Driver, etc.)
# Organization: Atomic → Composite → Complete hierarchy
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# TIMESTAMPS & AUDIT (Shared)
# ═══════════════════════════════════════════════════════════════════════════════

fragment TimestampFields on Node {
  createdAt
  updatedAt
}

fragment AuditTimestamps on ShipmentLog {
  createdAt
  eventTime
}

# ═══════════════════════════════════════════════════════════════════════════════
# PAGINATION (Shared)
# ═══════════════════════════════════════════════════════════════════════════════

fragment PageInfoFields on PageInfo {
  total
  hasMore
  offset
  limit
}

# ═══════════════════════════════════════════════════════════════════════════════
# PARTY REPUTATION (Shared across parties)
# ═══════════════════════════════════════════════════════════════════════════════

fragment PartyReputation on Node {
  rating: rating
  reviewCount: reviewCount
  isActive: isActive
  verificationStatus: verificationStatus
}

# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment CarrierBasicInfo on Carrier {
  id
  name
  email
  phone
  address
  city
  state
  zipCode
  country
  createdAt
  updatedAt
}

fragment CarrierReputation on Carrier {
  rating
  reviewCount
  isActive
  verificationStatus
}

fragment CarrierMetrics on Carrier {
  totalShipments
  onTimeDelivery
  damageRate
  safetyScore
}

fragment CarrierBasic on Carrier {
  id
  name
  email
  phone
  address
  city
  state
  country
}

fragment CarrierAuthorization on Carrier {
  mcNumber
  dotNumber
  driverLicense
  authorityStatus
}

fragment CarrierFleet on Carrier {
  truckCount
  driverCount
  specializations
}

fragment CarrierInsurance on Carrier {
  generalLiabilityAmount
  autoLiabilityAmount
  cargoLiabilityAmount
  insuranceProvider
}

# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment CarrierComplete on Carrier {
  ...CarrierBasic
  ...CarrierAuthorization
  ...CarrierFleet
  ...PartyReputation
  ...CarrierInsurance
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# BROKER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BrokerBasic on Broker {
  id
  name
  email
  phone
  address
  city
  state
  country
}

# ═══════════════════════════════════════════════════════════════════════════════
# BROKER: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BrokerComplete on Broker {
  ...BrokerBasic
  ...PartyReputation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment WarehouseBasic on Warehouse {
  id
  name
  email
  phone
  address
  city
  state
  country
}

fragment WarehouseCapacity on Warehouse {
  totalCapacityKg
  availableCapacityKg
  usedCapacityKg
  capacityUtilization
}

fragment WarehouseReputation on Warehouse {
  rating
  reviewCount
  isActive
  verificationStatus
}

# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment WarehouseComplete on Warehouse {
  ...WarehouseBasic
  ...WarehouseCapacity
  ...WarehouseReputation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# DRIVER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment DriverBasic on Driver {
  id
  name
  email
  phone
  licenseNumber
  status
}
