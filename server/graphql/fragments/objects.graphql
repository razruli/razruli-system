# ═══════════════════════════════════════════════════════════════════════════════
# OBJECT FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════
# Reusable field groupings for core business objects (Freight, Shipment, etc.)
# Organization: Atomic → Composite → Complete hierarchy
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# TIMESTAMPS & AUDIT (Shared)
# ═══════════════════════════════════════════════════════════════════════════════

fragment TimestampFields on Node {
  createdAt
  updatedAt
}

# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment FreightIdentity on Freight {
  id
  freightNumber
  status
}

fragment FreightSpecs on Freight {
  productDescription
  weight
  volume
  dimensions
  class
}

fragment FreightHandling on Freight {
  isHazmat
  isFragile
  isPerishable
  temperatureControlRequired
  isValuable
}

fragment FreightLocation on Freight {
  currentWarehouseId
  pickupDate
  deliveryDate
  storageStartDate
}

fragment FreightParties on Freight {
  ownerId
  brokerId
  currentWarehouseId
}

# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment FreightComplete on Freight {
  ...FreightIdentity
  ...FreightSpecs
  ...FreightHandling
  ...FreightLocation
  ...FreightParties
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# SHIPMENT: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentIdentity on Shipment {
  id
  shipmentNumber
  status
}

fragment ShipmentParties on Shipment {
  ownerId
  brokerId
  carrierId
  driverId
  originWarehouseId
  destinationWarehouseId
}

fragment ShipmentTimeline on Shipment {
  scheduledPickupDate
  actualPickupDate
  scheduledDeliveryDate
  actualDeliveryDate
  completedAt
}

fragment ShipmentMargin on Shipment {
  ownerBudget
  brokerMarginPercent
  brokerMarginAmount
}

fragment ShipmentBidding on Shipment {
  biddingOpenedAt
  biddingOpenUntil
  acceptedBidId
}

fragment ShipmentPricing on Shipment {
  carrierRate
  brokerFee
  totalRevenue
  totalCost
  totalMargin
}

fragment ShipmentRoute on Shipment {
  originLat
  originLng
  destinationLat
  destinationLng
  estimatedDistance
  estimatedDuration
}

fragment ShipmentDocumentation on Shipment {
  poNumber
  specialInstructions
  references
}

# ═══════════════════════════════════════════════════════════════════════════════
# SHIPMENT: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentComplete on Shipment {
  ...ShipmentIdentity
  ...ShipmentParties
  ...ShipmentTimeline
  ...ShipmentMargin
  ...ShipmentBidding
  ...ShipmentPricing
  ...ShipmentRoute
  ...ShipmentDocumentation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# VEHICLE/TRUCK: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment TruckBasic on Truck {
  id
  licensePlate
  vin
  make
  model
  year
  status
}

# ═══════════════════════════════════════════════════════════════════════════════
# BIDDING: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BidBasic on ShipmentBid {
  id
  shipmentId
  carrierId
  rate
  status
}

fragment BidCompliance on ShipmentBid {
  ruleComplianceStatus
  remarks
}

fragment BidFinancial on ShipmentBid {
  rate
  estimatedDeliveryDate
  insuranceAmount
}

# ═══════════════════════════════════════════════════════════════════════════════
# BIDDING: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BidComplete on ShipmentBid {
  ...BidBasic
  ...BidCompliance
  ...BidFinancial
  ...TimestampFields
}

fragment BidRuleBasic on BidRule {
  id
  shipmentId
  ruleType
  requirementValue
  enforced
}

# ═══════════════════════════════════════════════════════════════════════════════
# AUDIT & EVENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment AuditLogBasic on ShipmentLog {
  id
  shipmentId
  eventType
  eventTime
  location
  mileage
  temperature
}

fragment ShipmentEventBasic on ShipmentEvent {
  id
  shipmentId
  eventCode
  eventDescription
  eventTime
  severity
  requiresAction
}

# ═══════════════════════════════════════════════════════════════════════════════
# JUNCTIONS & RELATIONSHIPS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentFreightBasic on ShipmentFreight {
  id
  sequenceNumber
  pickedUpAt
  deliveredAt
}

fragment ShipmentStopBasic on ShipmentStop {
  id
  sequenceNumber
  stopType
  address
  arrivedAt
  departedAt
}

fragment ShipmentDocumentBasic on ShipmentDocument {
  id
  documentType
  documentNumber
  fileName
  verified
  expiryDate
}
