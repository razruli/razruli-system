# ═══════════════════════════════════════════════════════════════════════════════
# COMPREHENSIVE GRAPHQL FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════
# Reusable field groupings to prevent duplication and ensure consistency
# Organization: Atomic → Composite → Complete hierarchy
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# TIMESTAMPS & AUDIT
# ═══════════════════════════════════════════════════════════════════════════════

fragment TimestampFields on Node {
  createdAt
  updatedAt
}

fragment AuditTimestamps on ShipmentLog {
  createdAt
  eventTime
}

# ═══════════════════════════════════════════════════════════════════════════════
# PAGINATION
# ═══════════════════════════════════════════════════════════════════════════════

fragment PageInfoFields on PageInfo {
  total
  hasMore
  offset
  limit
}

# ═══════════════════════════════════════════════════════════════════════════════
# PARTY: BASIC STRUCTURE
# ═══════════════════════════════════════════════════════════════════════════════

fragment CarrierBasicInfo on Carrier {
  id
  name
  email
  phone
  address
  city
  state
  zipCode
  country
  createdAt
  updatedAt
}

fragment CarrierReputation on Carrier {
  rating
  reviewCount
  isActive
  verificationStatus
}

fragment CarrierMetrics on Carrier {
  totalShipments
  onTimeDelivery
  damageRate
  safetyScore
}

# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment FreightIdentity on Freight {
  id
  freightNumber
  status
}

fragment FreightSpecs on Freight {
  productDescription
  weight
  volume
  dimensions
  class
}

fragment FreightHandling on Freight {
  isHazmat
  isFragile
  isPerishable
  temperatureControlRequired
  isValuable
}

fragment FreightLocation on Freight {
  currentWarehouseId
  pickupDate
  deliveryDate
  storageStartDate
}

fragment FreightParties on Freight {
  ownerId
  brokerId
  currentWarehouseId
}

# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment FreightComplete on Freight {
  ...FreightIdentity
  ...FreightSpecs
  ...FreightHandling
  ...FreightLocation
  ...FreightParties
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# SHIPMENT: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentIdentity on Shipment {
  id
  shipmentNumber
  status
}

fragment ShipmentParties on Shipment {
  ownerId
  brokerId
  carrierId
  driverId
  originWarehouseId
  destinationWarehouseId
}

fragment ShipmentTimeline on Shipment {
  scheduledPickupDate
  actualPickupDate
  scheduledDeliveryDate
  actualDeliveryDate
  completedAt
}

fragment ShipmentMargin on Shipment {
  ownerBudget
  brokerMarginPercent
  brokerMarginAmount
}

fragment ShipmentBidding on Shipment {
  biddingOpenedAt
  biddingOpenUntil
  acceptedBidId
}

fragment ShipmentPricing on Shipment {
  carrierRate
  brokerFee
  totalRevenue
  totalCost
  totalMargin
}

fragment ShipmentRoute on Shipment {
  originLat
  originLng
  destinationLat
  destinationLng
  estimatedDistance
  estimatedDuration
}

fragment ShipmentDocumentation on Shipment {
  poNumber
  specialInstructions
  references
}

# ═══════════════════════════════════════════════════════════════════════════════
# SHIPMENT: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentComplete on Shipment {
  ...ShipmentIdentity
  ...ShipmentParties
  ...ShipmentTimeline
  ...ShipmentMargin
  ...ShipmentBidding
  ...ShipmentPricing
  ...ShipmentRoute
  ...ShipmentDocumentation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment CarrierBasic on Carrier {
  id
  name
  email
  phone
  address
  city
  state
  country
}

fragment CarrierAuthorization on Carrier {
  mcNumber
  dotNumber
  driverLicense
  authorityStatus
}

fragment CarrierFleet on Carrier {
  truckCount
  driverCount
  specializations
}

fragment CarrierInsurance on Carrier {
  generalLiabilityAmount
  autoLiabilityAmount
  cargoLiabilityAmount
  insuranceProvider
}

# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment CarrierComplete on Carrier {
  ...CarrierBasic
  ...CarrierAuthorization
  ...CarrierFleet
  ...PartyReputation
  ...CarrierInsurance
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# BROKER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BrokerBasic on Broker {
  id
  name
  email
  phone
  address
  city
  state
  country
}

# ═══════════════════════════════════════════════════════════════════════════════
# BROKER: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BrokerComplete on Broker {
  ...BrokerBasic
  ...PartyReputation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# BIDDING: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BidBasic on ShipmentBid {
  id
  shipmentId
  carrierId
  rate
  status
}

fragment BidCompliance on ShipmentBid {
  ruleComplianceStatus
  remarks
}

fragment BidFinancial on ShipmentBid {
  rate
  estimatedDeliveryDate
  insuranceAmount
}

# ═══════════════════════════════════════════════════════════════════════════════
# BIDDING: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment BidComplete on ShipmentBid {
  ...BidBasic
  ...BidCompliance
  ...BidFinancial
  ...TimestampFields
}

fragment BidRuleBasic on BidRule {
  id
  shipmentId
  ruleType
  requirementValue
  enforced
}

# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment WarehouseBasic on Warehouse {
  id
  name
  email
  phone
  address
  city
  state
  country
}

fragment WarehouseCapacity on Warehouse {
  totalCapacityKg
  availableCapacityKg
  usedCapacityKg
  capacityUtilization
}

fragment WarehouseReputation on Warehouse {
  rating
  reviewCount
  isActive
  verificationStatus
}

# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE: COMPOSITE FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment WarehouseComplete on Warehouse {
  ...WarehouseBasic
  ...WarehouseCapacity
  ...WarehouseReputation
  ...TimestampFields
}

# ═══════════════════════════════════════════════════════════════════════════════
# VEHICLE/DRIVER: ATOMIC FRAGMENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment DriverBasic on Driver {
  id
  name
  email
  phone
  licenseNumber
  status
}

fragment TruckBasic on Truck {
  id
  licensePlate
  vin
  make
  model
  year
  status
}

# ═══════════════════════════════════════════════════════════════════════════════
# AUDIT & EVENTS
# ═══════════════════════════════════════════════════════════════════════════════

fragment AuditLogBasic on ShipmentLog {
  id
  shipmentId
  eventType
  eventTime
  location
  mileage
  temperature
}

fragment ShipmentEventBasic on ShipmentEvent {
  id
  shipmentId
  eventCode
  eventDescription
  eventTime
  severity
  requiresAction
}

# ═══════════════════════════════════════════════════════════════════════════════
# CONTRACTS & RATES
# ═══════════════════════════════════════════════════════════════════════════════

fragment ContractBasic on BrokerCarrierContract {
  id
  contractNumber
  status
  startDate
  endDate
}

fragment RateBasic on BrokerRate {
  id
  rate
  minimumCharge
  effectiveDate
  expiryDate
}

fragment AccessorialBasic on CarrierAccessorial {
  id
  serviceCode
  serviceName
  unitType
  unitRate
  isApproved
}

# ═══════════════════════════════════════════════════════════════════════════════
# JUNCTIONS & RELATIONSHIPS
# ═══════════════════════════════════════════════════════════════════════════════

fragment ShipmentFreightBasic on ShipmentFreight {
  id
  sequenceNumber
  pickedUpAt
  deliveredAt
}

fragment ShipmentStopBasic on ShipmentStop {
  id
  sequenceNumber
  stopType
  address
  arrivedAt
  departedAt
}

fragment ShipmentDocumentBasic on ShipmentDocument {
  id
  documentType
  documentNumber
  fileName
  verified
  expiryDate
}

# ═══════════════════════════════════════════════════════════════════════════════
# ERROR HANDLING
# ═══════════════════════════════════════════════════════════════════════════════

fragment ErrorDetails on Error {
  code
  message
  extensions
}
