# ═══════════════════════════════════════════════════════════════════════════════
# REVIEWS MUTATIONS
# ═══════════════════════════════════════════════════════════════════════════════

extend type Mutation {
  """
  Create review, update carrier rating
  """
  createReview(carrierId: ID!, input: ReviewInput!): Review!

  """
  Update review if allowed, recalculate carrier rating
  """
  updateReview(id: ID!, input: ReviewInput!): Review!
}
