# ═══════════════════════════════════════════════════════════════════════════════
# JUNCTIONS MUTATIONS
# ═══════════════════════════════════════════════════════════════════════════════

extend type Mutation {
  createShipmentFreight(input: CreateShipmentFreightInput!): ShipmentFreight!
  updateShipmentFreight(
    id: ID!
    input: UpdateShipmentFreightInput!
  ): ShipmentFreight!

  createShipmentStop(input: CreateShipmentStopInput!): ShipmentStop!
  updateShipmentStop(id: ID!, input: UpdateShipmentStopInput!): ShipmentStop!

  createShipmentLog(input: CreateShipmentLogInput!): ShipmentLog!

  createShipmentEvent(input: CreateShipmentEventInput!): ShipmentEvent!

  createShipmentDocument(input: CreateShipmentDocumentInput!): ShipmentDocument!
  updateShipmentDocument(
    id: ID!
    input: UpdateShipmentDocumentInput!
  ): ShipmentDocument!
}
