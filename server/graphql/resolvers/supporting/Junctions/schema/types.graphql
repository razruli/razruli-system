# ═══════════════════════════════════════════════════════════════════════════════
# JUNCTIONS TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

type ShipmentFreight implements Node {
  id: ID!
  createdAt: DateTime!

  shipment: Shipment!
  freight: Freight!

  sequenceNumber: Int!
  pickedUpAt: DateTime
  deliveredAt: DateTime
}

type ShipmentStop implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  shipment: Shipment!
  sequenceNumber: Int!
  stopType: String!

  warehouse: Warehouse
  latitude: Float
  longitude: Float
  address: String

  arrivedAt: DateTime
  departedAt: DateTime

  duration: Int
  notes: String
}

type ShipmentLog implements Node {
  id: ID!
  createdAt: DateTime!

  shipment: Shipment!
  eventType: String!
  eventTime: DateTime!

  location: String
  latitude: Float
  longitude: Float

  mileage: Float
  fuelLevel: String

  temperature: Float
  humidity: Float

  deviceId: String
  notes: String
}

type ShipmentEvent implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  shipment: Shipment!
  eventCode: String!
  eventDescription: String!
  eventTime: DateTime!

  severity: String!
  requiresAction: Boolean!

  actionTaken: String
  actionDate: DateTime
}

type ShipmentDocument implements Node {
  id: ID!
  createdAt: DateTime!

  shipment: Shipment!
  documentType: String!
  documentNumber: String

  fileName: String!
  fileUrl: String!
  fileSize: Int

  uploadedAt: DateTime!
  expiresAt: DateTime

  issueDate: DateTime
  expiryDate: DateTime

  verified: Boolean!
  verifiedAt: DateTime
  verifiedBy: String
}

input CreateShipmentFreightInput {
  shipmentId: ID!
  freightId: ID!
  sequenceNumber: Int!
}

input UpdateShipmentFreightInput {
  pickedUpAt: DateTime
  deliveredAt: DateTime
}

input CreateShipmentStopInput {
  shipmentId: ID!
  sequenceNumber: Int!
  stopType: String!
  warehouseId: ID
  latitude: Float
  longitude: Float
  address: String
}

input UpdateShipmentStopInput {
  arrivedAt: DateTime
  departedAt: DateTime
  notes: String
}

input CreateShipmentLogInput {
  shipmentId: ID!
  eventType: String!
  location: String
  latitude: Float
  longitude: Float
  mileage: Float
  temperature: Float
  deviceId: String
}

input CreateShipmentEventInput {
  shipmentId: ID!
  eventCode: String!
  eventDescription: String!
  severity: String
  requiresAction: Boolean
}

input CreateShipmentDocumentInput {
  shipmentId: ID!
  documentType: String!
  documentNumber: String
  fileName: String!
  fileUrl: String!
  issueDate: DateTime
  expiryDate: DateTime
}

input UpdateShipmentDocumentInput {
  verified: Boolean
  verifiedBy: String
}
