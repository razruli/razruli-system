# ═══════════════════════════════════════════════════════════════════════════════
# CONTRACTS QUERIES
# ═══════════════════════════════════════════════════════════════════════════════

extend type Query {
  getBrokerCarrierContract(id: ID!): BrokerCarrierContract
  listBrokerCarrierContracts(
    brokerId: ID
    carrierId: ID
    input: PaginationInput!
  ): BrokerCarrierContractConnection!

  getBrokerRate(id: ID!): BrokerRate
  listBrokerRates(
    contractId: ID!
    input: PaginationInput!
  ): BrokerRateConnection!

  getCarrierRate(id: ID!): CarrierRate
  listCarrierRates(
    carrierId: ID!
    input: PaginationInput!
  ): CarrierRateConnection!

  getCarrierAccessorial(id: ID!): CarrierAccessorial
  listCarrierAccessorials(
    carrierId: ID!
    input: PaginationInput!
  ): CarrierAccessorialConnection!
}

type BrokerCarrierContractConnection {
  items: [BrokerCarrierContract!]!
  pageInfo: PageInfo!
}

type BrokerRateConnection {
  items: [BrokerRate!]!
  pageInfo: PageInfo!
}

type CarrierRateConnection {
  items: [CarrierRate!]!
  pageInfo: PageInfo!
}

type CarrierAccessorialConnection {
  items: [CarrierAccessorial!]!
  pageInfo: PageInfo!
}
