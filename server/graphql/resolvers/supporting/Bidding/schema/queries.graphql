# ═══════════════════════════════════════════════════════════════════════════════
# BIDDING QUERIES
# ═══════════════════════════════════════════════════════════════════════════════

extend type Query {
  """
  Get bid by ID
  """
  getBid(id: ID!): ShipmentBid

  """
  List all bids
  """
  listBids(input: PaginationInput!): BidConnection!

  """
  Rule #4: List bids for shipment (all visible with compliance status)
  """
  listBidsForShipment(shipmentId: ID!, input: PaginationInput!): BidConnection!

  """
  List bids submitted by carrier
  """
  listBidsForCarrier(
    carrierId: String!
    input: PaginationInput!
  ): BidConnection!

  """
  Get bid rules for shipment
  """
  getBidRules(shipmentId: ID!): [BidRule!]!
}

type BidConnection {
  items: [ShipmentBid!]!
  pageInfo: PageInfo!
}
