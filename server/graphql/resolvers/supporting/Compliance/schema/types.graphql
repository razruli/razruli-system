# ═══════════════════════════════════════════════════════════════════════════════
# COMPLIANCE TYPES
# ═══════════════════════════════════════════════════════════════════════════════

type ComplianceStatus implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  carrierId: String!
  carrier: Carrier!

  hosCompliant: Boolean!
  vehicleAgeMet: Boolean!
  hazmatCertified: Boolean!
  temperatureControlEquipped: Boolean!
  insuranceCurrent: Boolean!
}

type ComplianceIssue implements Node {
  id: ID!
  createdAt: DateTime!

  carrierId: String!
  issueType: String!
  severity: String!
  description: String!
  resolvedAt: DateTime
}

input ComplianceFilterInput {
  carrierId: String!
  severity: String
}
