# ═══════════════════════════════════════════════════════════════════════════════
# PENALTIES QUERIES
# ═══════════════════════════════════════════════════════════════════════════════

extend type Query {
  """
  Rule #7: Get cancellation fee for shipment
  POSTED: $0
  BIDDING_OPEN: 5% fee
  BID_SELECTED: 10% fee
  """
  getCancellationFee(shipmentId: ID!): CancellationFee

  """
  List all cancellation fees
  """
  listCancellationFees(input: PaginationInput!): CancellationFeeConnection!

  """
  Get penalty distribution breakdown
  Shows each bidder's compensation if cancelled
  """
  getPenaltyDistribution(shipmentId: ID!): [PenaltyPayment!]!
}

type CancellationFeeConnection {
  items: [CancellationFee!]!
  pageInfo: PageInfo!
}
