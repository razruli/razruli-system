# ═══════════════════════════════════════════════════════════════════════════════
# PENALTIES TYPES
# ═══════════════════════════════════════════════════════════════════════════════

"""
Rule #7: Cancellation Penalties (Protect Bidders)
5% fee if cancelled after BIDDING_OPEN
10% fee if cancelled after BID_SELECTED (10% to selected, 5% to others)
"""
type CancellationFee implements Node {
  id: ID!
  createdAt: DateTime!

  shipmentId: ID!
  totalFeeAmount: BigInt!
  feePercentage: Float!

  calculatedAt: DateTime!
  distributedAt: DateTime
  paidBidderIds: [String!]!
}

"""
Penalty payment to bidder
"""
type PenaltyPayment implements Node {
  id: ID!
  createdAt: DateTime!

  carrierId: String!
  bidId: ID!
  amount: BigInt!
  status: String!
}

input PenaltyFilterInput {
  shipmentId: ID!
  status: String
}
