# ═══════════════════════════════════════════════════════════════════════════════
# SHIPMENT SUBSCRIPTIONS
# ═══════════════════════════════════════════════════════════════════════════════

extend type Subscription {
  """
  Real-time: Shipment status changes
  """
  shipmentStatusChanged(shipmentId: ID!): ShipmentStatusEvent!

  """
  Real-time: New bid received
  Rule #4: Bid Rules Auto-Validation - bid visible with compliance status
  """
  bidReceived(shipmentId: ID!): BidReceivedEvent!

  """
  Real-time: Bid accepted
  """
  bidAccepted(shipmentId: ID!): BidAcceptedEvent!
}

type ShipmentStatusEvent {
  shipmentId: ID!
  oldStatus: ShipmentStatus!
  newStatus: ShipmentStatus!
  timestamp: DateTime!
}

type BidReceivedEvent {
  bid: ShipmentBid!
  shipmentId: ID!
  timestamp: DateTime!
}

type BidAcceptedEvent {
  bidId: ID!
  shipmentId: ID!
  carrierId: String!
  timestamp: DateTime!
}
