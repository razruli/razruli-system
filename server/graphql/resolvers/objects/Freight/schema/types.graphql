# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

"""
Freight status progression
DRAFT → AVAILABLE → CLAIMED → ASSIGNED → COMPLETED
"""
enum FreightStatus {
  DRAFT
  AVAILABLE
  CLAIMED
  ASSIGNED
  COMPLETED
  ARCHIVED
}

"""
Physical cargo awaiting transport
Locked to one broker at a time (CLAIMED status)
Rule #2: Single Broker Lock - one freight per broker
"""
type Freight implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Identification
  freightNumber: String!
  status: FreightStatus!

  # Parties
  owner: FreightOwner!
  ownerId: String!
  broker: Broker
  brokerId: String

  # Physical specs
  productName: String!
  productDescription: String
  productType: String!
  hsCode: String
  unitType: String!
  quantity: Int!
  unitWeight: Float!
  totalWeight: Float!
  length: Float
  width: Float
  height: Float
  volume: Float!

  # Special handling
  isHazmat: Boolean!
  hazmatClass: String
  hazmatUNNumber: String
  hazmatDescription: String
  isFragile: Boolean!
  isPerishable: Boolean!
  temperatureMin: Float
  temperatureMax: Float
  isValueable: Boolean!
  declaredValue: BigInt
  requiresHandling: [String!]!

  # Warehouse assignment
  currentWarehouse: Warehouse
  currentWarehouseId: String
  storageStartDate: DateTime
  storageEndDate: DateTime

  # Relations
  shipments: [Shipment!]!
}

input CreateFreightInput {
  productName: String!
  productDescription: String
  productType: String!
  hsCode: String
  unitType: String
  quantity: Int!
  unitWeight: Float!
  totalWeight: Float!
  length: Float
  width: Float
  height: Float
  volume: Float!
  isHazmat: Boolean
  hazmatClass: String
  hazmatUNNumber: String
  hazmatDescription: String
  isFragile: Boolean
  isPerishable: Boolean
  temperatureMin: Float
  temperatureMax: Float
  isValueable: Boolean
  declaredValue: BigInt
  requiresHandling: [String!]
}

input UpdateFreightInput {
  productName: String
  productDescription: String
  quantity: Int
  temperatureMin: Float
  temperatureMax: Float
  declaredValue: BigInt
}
