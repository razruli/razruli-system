# ═══════════════════════════════════════════════════════════════════════════════
# VEHICLE (TRUCK) TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

enum TruckStatus {
  AVAILABLE
  IN_MAINTENANCE
  IN_TRANSIT
  OUT_OF_SERVICE
}

type Vehicle implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  licensePlate: String!
  vin: String!
  make: String!
  model: String!
  year: Int!
  status: TruckStatus!

  carrier: Carrier!
  carrierId: String!
  currentDriver: Driver
  driverId: String
}

input CreateVehicleInput {
  licensePlate: String!
  vin: String!
  make: String!
  model: String!
  year: Int!
}

input UpdateVehicleInput {
  licensePlate: String
  make: String
  model: String
}
