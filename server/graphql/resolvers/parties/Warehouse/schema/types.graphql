# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

type Warehouse implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Basic info
  name: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String!

  # Capacity
  totalCapacityKg: Float!
  availableCapacityKg: Float!
  usedCapacityKg: Float!
  capacityUtilization: Float!

  # Reputation
  rating: Float!
  reviewCount: Int!
  totalShipments: Int!
  isActive: Boolean!
  verificationStatus: VerificationStatus!
}

input CreateWarehouseInput {
  name: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String
  totalCapacityKg: Float!
}

input UpdateWarehouseInput {
  email: String
  phone: String
  address: String
}
