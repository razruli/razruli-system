# ═══════════════════════════════════════════════════════════════════════════════
# WAREHOUSE QUERIES
# ═══════════════════════════════════════════════════════════════════════════════

extend type Query {
  getWarehouse(id: ID!): Warehouse
  listWarehouses(input: PaginationInput!): WarehouseConnection!
  searchWarehouses(
    location: String
    capacity: Float
    input: PaginationInput!
  ): WarehouseConnection!
}

type WarehouseConnection {
  items: [Warehouse!]!
  pageInfo: PageInfo!
}
