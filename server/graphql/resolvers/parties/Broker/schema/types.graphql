# ═══════════════════════════════════════════════════════════════════════════════
# BROKER TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

"""
Freight broker - coordinates shipment movement
Phase 2-11: Creates shipments, opens bidding, selects carriers
"""
type Broker implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Basic info
  companyName: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String!

  # Reputation
  rating: Float!
  reviewCount: Int!
  totalShipments: Int!
  isActive: Boolean!
  verificationStatus: VerificationStatus!

  # Relations
  shipments: [Shipment!]!
}

input CreateBrokerInput {
  companyName: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String
}
