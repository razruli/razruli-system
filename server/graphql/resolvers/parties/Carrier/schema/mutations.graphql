# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER MUTATIONS
# ═══════════════════════════════════════════════════════════════════════════════

extend type Mutation {
  """
  Create new carrier account
  """
  createCarrier(input: CreateCarrierInput!): Carrier!

  """
  Update carrier information
  """
  updateCarrier(id: ID!, input: CreateCarrierInput!): Carrier!

  """
  Phase 4-5: Carrier submits bid on shipment
  Rule #4: Bid Rules Auto-Validation
  """
  submitBid(shipmentId: ID!, rate: BigInt!, input: BidInput!): ShipmentBid!
}

input BidInput {
  estimatedDeliveryDate: DateTime
  insuranceAmount: BigInt
  notes: String
}
