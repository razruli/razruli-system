# ═══════════════════════════════════════════════════════════════════════════════
# CARRIER QUERIES
# ═══════════════════════════════════════════════════════════════════════════════

extend type Query {
  """
  Get carrier by ID
  Rule #10: Visible Assignment - broker/owner can see carrier details
  """
  getCarrier(id: ID!): Carrier

  """
  List all carriers with pagination
  """
  listCarriers(input: PaginationInput!): CarrierConnection!

  """
  Search carriers by specializations, capacity, rating
  Rule #10: Visible Assignment - show rating to all
  """
  searchCarriers(
    specializations: [String!]
    capacity: Int
    rating: Float
    input: PaginationInput!
  ): CarrierConnection!

  """
  List carriers by minimum rating
  """
  listCarriersByRating(
    minRating: Float!
    input: PaginationInput!
  ): CarrierConnection!
}

type CarrierConnection {
  items: [Carrier!]!
  pageInfo: PageInfo!
}
