# ═══════════════════════════════════════════════════════════════════════════════
# FREIGHT OWNER TYPE DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════

"""
Freight owner - cargo owner/shipper
Phase 1: Creates freight and defines specs
Rule #1: Real Loads Only
"""
type FreightOwner implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Basic info
  companyName: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String!

  # Reputation
  rating: Float!
  reviewCount: Int!
  totalShipments: Int!
  isActive: Boolean!
  verificationStatus: VerificationStatus!

  # Relations
  freights: [Freight!]!
  shipments: [Shipment!]!
}

input CreateFreightOwnerInput {
  companyName: String!
  email: String!
  phone: String!
  address: String!
  city: String!
  state: String!
  zipCode: String!
  country: String
}
