query GetEmployee($id: String!) {
  employee(id: $id) {
    id
    companyId
    departmentId
    department {
      id
      name
    }
    firstName
    lastName
    gradeId
    grade {
      id
      name
      kGrade
    }
    gender
    birthDate
    hireDate
    fireDate
    kEfficiency
    employmentType
    status
    workingHoursPerDay
    createdAt
    updatedAt
  }
}
